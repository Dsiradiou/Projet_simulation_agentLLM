# Configuration par défaut : configuration mixte (C1) à l'échelle prévue, 120 agents.
# Validée au chargement par sim/config.py : une clé inconnue ou une valeur invalide bloque le lancement.

run:
  seed: 42

simulation:
  duree_jours: 90          # un pas = un jour simulé
  mode: synchrone          # synchrone | asynchrone
  # Mode asynchrone (étape 15) : chaque agent décide quand une place se libère pour son modèle,
  # et voit ce qui a déjà été décidé ce jour-là. L'heure simulée de la journée suit le temps
  # réel de calcul ; les phases de modèles (1.7b et 4b, puis 8b) repartent chacune de debut_min.
  asynchrone:
    debut_min: 510           # 08:30
    minutes_par_seconde: 15  # une seconde de calcul = 15 minutes simulées
    fenetre_regles_min: 210  # agents à règles : heure tirée entre 08:30 et 12:00
  # Délai avant qu'un message soit lisible par son destinataire, en minutes simulées.
  # En mode synchrone, tout délai inférieur à 24 h revient à une lecture le lendemain.
  delais_livraison_min:
    zone: 0                # même lieu : immédiat
    direct: 120            # le temps qu'un proche lise : 2 h
    reseaux: 360           # le temps qu'une publication remonte dans les fils : 6 h

llm:
  # Modèle attribué à chaque palier (A5). Les configurations C2 et C3 du plan d'expériences
  # mettent tous les paliers sur un même modèle.
  modeles:
    grand: qwen3:8b
    moyen: qwen3:4b
    petit: qwen3:1.7b
  # Requêtes simultanées par palier, d'après le benchmark de l'étape 3 (docs/mesures/).
  parallelisme:
    grand: 4
    moyen: 4
    petit: 2               # instable au-delà de 2 sur le 1.7b
  delai_max_s: 60          # au-delà, l'appel compte comme sans réponse (A4)
  tokens_sortie_max: 320   # plafond de la réponse ; à 160, l'étape 3 voyait des JSON tronqués
  contexte_tokens: 2048    # identique à OLLAMA_CONTEXT_LENGTH, sinon Ollama recharge le modèle
  temperature: 0.8

agents:
  # Moteur des rôles LLM : « llm » (configurations C1 à C3) ou « regles » (baseline C0, E1) :
  # mêmes agents, même monde, même réseau, mêmes déclencheurs ; seule la décision change.
  moteur: llm
  # Seuil d'adoption individuel (Granovetter) : part de porteurs dans sa zone à partir de
  # laquelle un agent adopte. Tiré pour chaque agent dans une loi normale bornée à [0, 1],
  # avec sa propre graine. Sert au repli des agents LLM (A4) et aux agents à règles.
  seuil_adoption:
    moyenne: 0.35
    ecart_type: 0.15
  # Messages qu'un agent LLM peut envoyer par semaine simulée, selon son rôle : c'est le rôle,
  # et non la taille du modèle, qui décide de la propension à parler (constat de l'étape 6).
  messages_par_semaine:
    pharmacien: 3
    createur_contenu: 5
    journaliste: 2
    responsable_marque: 4
    habitue_soin: 2
    baigneur_occasionnel: 1
    sceptique: 1

# Météo saisonnière (règles, étape 13) : la température moyenne monte de `temperature_debut` à
# `temperature_plateau` en `montee_jours`, puis reste estivale jusqu'au bout (pas de rentrée :
# décision du binôme, 19 oct.). Le temps (beau ou mauvais) suit une chaîne de Markov ; la
# température du jour garde une part de celle de la veille (`persistance`). Canicule : au-delà de
# `seuil_canicule`. L'indice UV découle du temps et de la chaleur, toujours cohérent avec eux.
meteo:
  temperature_debut: 26
  temperature_plateau: 30
  montee_jours: 21
  ecart_jour: 2.5
  persistance: 0.6
  seuil_canicule: 33
  beau_vers_mauvais: 0.15
  mauvais_vers_beau: 0.5
  duree_vague_chaleur: 3     # jours de canicule après une perturbation « vague_chaleur »

# Commerce (règles, étape 13) : stock de flacons Vaelys par point de vente, pour 100 agents (mis à
# l'échelle de la population). Un nouveau porteur achète un flacon là où il se trouve, sinon au
# point de vente le mieux fourni ; en rupture, l'achat échoue. Réassort par les vendeurs le
# vendredi (jours 5, 12…).
commerce:
  points_de_vente: [pharmacie, centre_commercial]
  # Les vendeurs commandent selon les ventes de la semaine (avec une marge), sans descendre sous un
  # minimum : l'offre suit la demande et une rupture n'arrive que si la demande s'emballe. Calibré le
  # 19 oct. : avec un réassort fixe, chaque flacon livré était vendu (222 achats sur 5 graines),
  # l'offre bornait l'adoption au lieu de la dynamique sociale.
  stock_initial_pour_100: 25   # flacons par point de vente au jour 1
  reassort_pour_100: 10        # commande minimale par point de vente et par semaine
  marge_commande: 1.2          # commande = ventes de la semaine × marge
  jour_reassort: 5           # jour de la semaine (jour % 7)
  duree_flacon_jours: 12     # jours d'usage d'un flacon, puis il faut racheter

# Règles des agents qui ne sont pas LLM (étape 13).
regles:
  # Fidèles à une autre marque : seuil d'adoption relevé, et encore plus pendant une promotion
  # de la marque concurrente ; ils reviennent à leur marque si la mode recule autour d'eux.
  bonus_fidelite: 0.25
  bonus_promotion: 0.15
  recul_abandon: 0.15        # baisse de la part de porteurs autour d'eux qui les fait revenir
  # Baseline C0 (seuil + Bass + déclin) pour les rôles LLM quand agents.moteur = regles.
  p_externe: 0.01            # influence externe quotidienne (Bass p)
  p_campagne: 0.08           # les jours de communiqué, d'animation, de publication virale ou d'article
  q_message: 0.08            # pression sociale ajoutée par message reçu (Bass q), au plus 3
  recul_mode: 0.2            # baisse de la part de porteurs qui fait abandonner (Berger, Le Mens)
  p_abandon_recul: 0.3       # probabilité d'abandonner quand la mode recule
  p_abandon_polemique: 0.25  # probabilité d'abandonner après une polémique perçue

# Ce qui fait reconsidérer sa décision à un agent, en plus d'un message reçu ou d'une
# perturbation dans sa zone (règle 10 : sans déclencheur, aucun appel).
declencheurs:
  # Délai de réflexion : un agent ne reconsidère pas plus d'une fois tous les 3 jours à cause
  # d'un message, de l'exposition, de la météo ou de la lassitude (décidé le 18 oct. : borne le
  # coût, environ 2 500 appels au plus pour 120 agents sur 90 jours). Les messages reçus entre-
  # temps s'accumulent et sont lus à la décision suivante. Une perturbation reste immédiate.
  delai_reflexion_jours: 3
  # Le délai de chaque agent est tiré après chaque décision entre 3 - 1 et 3 + 1 jours : sans cela,
  # tous les agents, partis le jour 1, décident ensemble tous les 3 jours (mesuré le 18 oct.).
  delai_reflexion_ecart: 1
  exposition_ecart: 0.15     # la part de porteurs autour de lui a changé d'au moins 15 points
  meteo_uv_fort: 9           # début d'une journée de canicule ou d'indice UV >= 9
  lassitude_jours: 10        # pas reconsidéré depuis 10 jours

# Réseau social : qui suit qui (publications « réseaux ») et cercle de proches (messages directs).
reseau:
  abonnements_par_agent: 6   # comptes suivis par chaque agent
  contacts_directs: 4        # proches de chaque agent, en partie réciproques
  # Attractivité d'un compte (poids dans le tirage des abonnements) : les créateurs de contenu
  # et les médias ont une large audience. Rôle absent : poids 1.
  audience:
    createur_contenu: 10
    journaliste: 6
    responsable_marque: 6
    pharmacien: 3

# Routines de déplacement (règles) : chaque matin, un agent reste dans sa zone avec la
# probabilité `stabilite`, sinon il tire sa zone selon les poids de son rôle et du temps qu'il fait
# (beau : ensoleillé ou canicule ; mauvais : nuageux ou pluie). Rôle absent : il ne bouge pas.
routines:
  stabilite: 0.4
  roles:
    pharmacien:
      beau: {pharmacie: 9, plage: 1}
      mauvais: {pharmacie: 9, domicile: 1}
    createur_contenu:
      beau: {plage: 4, reseaux_sociaux: 3, piscine: 2, centre_commercial: 1}
      mauvais: {reseaux_sociaux: 6, centre_commercial: 2, domicile: 2}
    journaliste:
      beau: {reseaux_sociaux: 3, centre_commercial: 3, plage: 2, pharmacie: 2}
      mauvais: {reseaux_sociaux: 5, domicile: 3, centre_commercial: 2}
    responsable_marque:
      beau: {centre_commercial: 4, reseaux_sociaux: 4, pharmacie: 2}
      mauvais: {reseaux_sociaux: 6, centre_commercial: 4}
    habitue_soin:
      beau: {plage: 4, piscine: 3, pharmacie: 2, domicile: 1}
      mauvais: {domicile: 4, pharmacie: 3, centre_commercial: 3}
    baigneur_occasionnel:
      beau: {plage: 6, piscine: 2, terrain_sport: 1, domicile: 1}
      mauvais: {domicile: 5, centre_commercial: 3, reseaux_sociaux: 2}
    sceptique:
      beau: {terrain_sport: 3, plage: 3, domicile: 3, centre_commercial: 1}
      mauvais: {domicile: 6, centre_commercial: 2, reseaux_sociaux: 2}
    fidele_autre_marque:
      beau: {plage: 4, piscine: 2, terrain_sport: 2, domicile: 2}
      mauvais: {domicile: 6, centre_commercial: 4}
    vendeur:
      beau: {centre_commercial: 8, pharmacie: 2}
      mauvais: {centre_commercial: 8, pharmacie: 2}
    marque_concurrente:
      beau: {centre_commercial: 1}
      mauvais: {centre_commercial: 1}

# Base de connaissances (RAG, étape 12) : avant chaque décision LLM, l'agent retrouve des passages
# du corpus (filtrés par date et par rôle) et ses propres souvenirs, ajoutés à son prompt.
rag:
  actif: true
  # Choisi sur mesure (docs/mesures/embeddings_*.md) : 100 % de réussite au rang 4 sur 40 questions
  # françaises, 633 Mo de VRAM (tient à côté du 8b) ; nomic-embed-text, anglophone, plafonne à 87 %.
  modele_embeddings: bge-m3
  passages: 4                # documents du corpus retrouvés par décision
  souvenirs: 3               # souvenirs retrouvés par décision (jours précédents seulement)

monde:
  # Choisis à l'étape 11 après le test de contamination (docs/mesures/contamination_*.md) :
  # aucun modèle ne prétend les connaître et aucune marque réelle ne porte ces noms.
  # L'indice suit une échelle inventée, pour que les modèles ne raisonnent pas en SPF réels.
  brand_name: Vaelys
  ingredient: nacrelle
  concurrent: Zelvane      # marque concurrente du corpus (test de contamination : 8 %, aucune marque réelle)
  indice_protection: Halo 4 (sur une échelle de 1 à 5)

# Nombre d'agents par rôle (exigence C2 : fixé au lancement, sans modifier le code).
population:
  # Agents LLM (84)
  pharmacien: 6               # palier grand
  createur_contenu: 6         # palier moyen
  journaliste: 3              # palier moyen
  responsable_marque: 1       # palier moyen
  habitue_soin: 16            # palier moyen
  baigneur_occasionnel: 36    # palier petit
  sceptique: 16               # palier petit
  # Agents à règles (36)
  fidele_autre_marque: 22
  vendeur: 12
  marque_concurrente: 1
  meteo: 1

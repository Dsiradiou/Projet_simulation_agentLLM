  createur_contenu: 3         # palier moyen
  journaliste: 2              # palier moyen
  responsable_marque: 1       # palier moyen
  habitue_soin: 8             # palier moyen
  baigneur_occasionnel: 17    # palier petit
  sceptique: 8                # palier petit
  # Agents à règles (18)
  fidele_autre_marque: 11
  vendeur: 6
  marque_concurrente: 1
  meteo: 1

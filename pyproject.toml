[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mondes-vivants-ephemere"
version = "0.1.0"
description = "Simulation multi-agents pilotée par LLM de la viralité d'une tendance (sujet 04 ÉPHÉMÈRE)."
readme = "README.md"
requires-python = "==3.12.*"
# Dépendances directes, versions exactes. Les dépendances indirectes sont figées dans
# requirements.lock (voir README, section Installation).
dependencies = [
    "aiokafka==0.14.0",
    "chromadb==1.5.9",
    "duckdb==1.5.6",
    "fastapi==0.144.0",
    "httpx==0.28.1",
    "ollama==0.6.3",
    "pyarrow==26.0.0",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "PyYAML==6.0.3",
    "redis==8.1.0",
    "uvicorn==0.54.0",
    "websockets==17.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.setuptools]
packages = ["sim", "agents", "llm", "bus", "rag", "indicators", "bridge", "replay"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: nécessite Kafka et Redis lancés (docker compose up -d)",
    "ollama: nécessite Ollama lancé avec les modèles Qwen3",
    "godot: nécessite Godot 4 (variable GODOT_BIN dans .env)",
]
# Starlette annonce le remplacement de httpx par httpx2 dans son client de test : sans effet ici.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
